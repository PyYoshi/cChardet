name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-safety:
    name: Native ASan / UBSan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure sanitizers
        run: >-
          cmake -S src/ext/uchardet -B build/uchardet-sanitize
          -DBUILD_BINARY=OFF -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Werror=maybe-uninitialized"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - run: cmake --build build/uchardet-sanitize --parallel 2
      - run: ctest --test-dir build/uchardet-sanitize --output-on-failure

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-2025, windows-11-arm, macos-26]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          # On Windows ARM64, uv picks an emulated x86-64 interpreter unless the
          # request names the architecture.
          python-version: ${{ matrix.os == 'windows-11-arm' && format('cpython-{0}-windows-aarch64-none', matrix.python-version) || matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check interpreter architecture
        shell: bash
        run: |
          uv run --no-sync python - <<'EOF'
          import os
          import platform
          import sysconfig

          plat = sysconfig.get_platform()
          # A universal2 build covers both macOS architectures, so check the running process.
          arch = platform.machine() if plat.endswith("universal2") else plat
          print(plat, arch)
          assert ("arm64" in arch or "aarch64" in arch) == (os.environ["RUNNER_ARCH"] == "ARM64")
          EOF

      - name: Lint
        if: matrix.os == 'ubuntu-26.04' && matrix.python-version == '3.14'
        run: uv run ruff check

      - name: Type check
        if: matrix.os == 'ubuntu-26.04' && matrix.python-version == '3.14'
        run: uv run mypy

      - name: Test
        run: uv run pytest

  package:
    name: Verify distributions
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          python-version: "3.14"

      - run: uv sync --locked
      - run: uv build
      - run: uv run twine check dist/*
