# SPDX-License-Identifier: MIT
name: C++20 wheel compatibility (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cxx20-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: C++20 wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CCHARDET_CXX_STANDARD: "20"
      CIBW_ENVIRONMENT_PASS_LINUX: CCHARDET_CXX_STANDARD
      CIBW_BUILD_VERBOSITY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/build-wheels
