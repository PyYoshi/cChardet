# SPDX-License-Identifier: MIT
name: C++20 wheel compatibility (opt-in)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '**.rst'

permissions:
  contents: read

concurrency:
  # An unrelated label event must not cancel an already running opt-in build.
  group: cxx20-wheels-${{ github.event_name }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  wheels:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'v3-cxx20-validation')
    name: C++20 wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CCHARDET_CXX_STANDARD: "20"
      CIBW_ENVIRONMENT_PASS_LINUX: CCHARDET_CXX_STANDARD
      CIBW_BUILD_VERBOSITY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/build-wheels
